    <!--
      The hero poster paints before anything else on the home page: the film
      runs at every width now, and the poster is what stands in its place until
      the first frame decodes. Preloading it has to happen before the bundle
      renders the hero, so it is done here rather than in the component.

      One fixed file, not a srcset: this is the same URL the <video poster>
      attribute carries, and that attribute takes a single image. Matching it
      exactly is what makes the preload a cache hit instead of a second fetch.
    -->
    <script>
      (function () {
        if (location.pathname.replace(/\/+$/, "") !== "") return;

        var link = document.createElement("link");
        link.rel = "preload";
        link.as = "image";
        link.type = "image/webp";
        link.href = "/media/hero-poster-960.webp";
        link.fetchPriority = "high";
        document.head.appendChild(link);
      })();
    </script>
